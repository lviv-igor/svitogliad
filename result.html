    "naturalist",
    "humanist",
    "relativist",

    "polytheist",
    "deist",
    "theist",
    "christian"
  ];

  var demoStats = {
    "atheist": 8,
    "agnostic": 14,
    "apatheist": 6,
    "nihilist": 3,
    "naturalist": 9,
    "humanist": 16,
    "relativist": 7,
    "pantheist": 10,
    "polytheist": 2,
    "deist": 8,
    "theist": 9,
    "christian": 5
  };

  function getProfileFromUrl() {
    var params = new URLSearchParams(window.location.search);
    var profile = params.get("profile");
    if (!profile) return "";
    return profile.toLowerCase();
  }

  function renderList(items) {
    var html = "<ul>";
    for (var i = 0; i < items.length; i++) {
      html += "<li>" + items[i] + "</li>";
    }
    html += "</ul>";
    return html;
  }

  function renderParagraphs(items) {
    var html = "";
    for (var i = 0; i < items.length; i++) {
      html += "<p>" + items[i] + "</p>";
    }
    return html;
  }

  function renderProfileMap(activeKey) {
    var maxCount = 1;

    for (var i = 0; i < profileOrder.length; i++) {
      var count = demoStats[profileOrder[i]] || 0;
      if (count > maxCount) maxCount = count;
    }

    var html = "";

    for (var j = 0; j < profileOrder.length; j++) {
      var key = profileOrder[j];
      var p = profiles[key];
      var countVal = demoStats[key] || 0;
      var percentWidth = Math.round((countVal / maxCount) * 100);
      var activeClass = key === activeKey ? " active" : "";

      html +=
        "<div class=\"profile-map-card" + activeClass + "\">" +
          "<div class=\"profile-map-name\">" + p.shortTitle + "</div>" +
          "<div>" +
            "<div class=\"profile-map-count\">" + countVal + " людей</div>" +
            "<div class=\"profile-map-bar\"><span style=\"width:" + percentWidth + "%\"></span></div>" +
          "</div>" +
        "</div>";
    }

    return html;
  }

  function getPercent(profileKey) {
    var total = 0;
    for (var i = 0; i < profileOrder.length; i++) {
      total += demoStats[profileOrder[i]] || 0;
    }

    var countVal = demoStats[profileKey] || 0;
    if (total <= 0) return 0;
    return Math.round((countVal / total) * 100);
  }

  function renderError() {
    var app = document.getElementById("app");

    app.innerHTML =
      "<div class=\"logo\">СВІТО<span>ГЛЯД</span></div>" +
      "<div class=\"error-box\">" +
        "<div class=\"error-title\">Профіль не знайдено</div>" +
        "<div class=\"error-text\">" +
          "Посилання не містить правильного параметра профілю. Спробуйте пройти тест ще раз." +
        "</div>" +
        "<div class=\"button-row\">" +
          "<a class=\"btn btn-primary\" href=\"index.html\">Пройти тест</a>" +
        "</div>" +
      "</div>";
  }

  function renderPage() {
    var profileKey = getProfileFromUrl();

        "<div class=\"invite-grid\">" +

            "<div class=\"invite-card-title\">Богослужіння</div>" +

      "</div>" +

      "<div class=\"button-row\">" +
        "<a class=\"btn btn-secondary\" href=\"index.html\">Пройти тест ще раз</a>" +
        "<button class=\"btn btn-secondary\" type=\"button\" onclick=\"copyCurrentLink()\">Скопіювати посилання</button>" +
      "</div>";
  }

  function copyCurrentLink() {
    var url = window.location.href;

    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(function() {
        alert("Посилання скопійовано.");
      }).catch(function() {
        alert("Не вдалося скопіювати автоматично. Скопіюйте посилання з адресного рядка браузера.");
      });
    } else {
      alert("Скопіюйте посилання з адресного рядка браузера.");
    }
  }

  renderPage();
